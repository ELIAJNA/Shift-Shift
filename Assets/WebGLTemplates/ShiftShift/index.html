<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <!--
      Shift+Shift page (day 25, tester feedback). Unlike Unity's Default template, the game fills the whole page,
      so it fills itch.io's frame and the whole screen in fullscreen. Clicking or going fullscreen gives the keys
      back to the game.
    -->
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #06081A; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #06081A; outline: none; }
      #loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 40%;
                 max-width: 360px; font: 600 16px/1.4 system-ui, sans-serif; color: #C9D1D8; text-align: center; }
      #bar { height: 6px; margin-top: 10px; background: #1E2440; border-radius: 3px; overflow: hidden; }
      #fill { height: 100%; width: 0; background: #00FCF9; }
      #error { display: none; position: absolute; left: 0; right: 0; top: 0; padding: 10px;
               font: 14px system-ui, sans-serif; color: #fff; background: #B00020; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">SHIFT+SHIFT<div id="bar"><div id="fill"></div></div></div>
    <div id="error"></div>
    <script>
      var canvas = document.getElementById("unity-canvas");
      function giveKeysToGame() { try { window.focus(); canvas.focus(); } catch (e) {} }
      window.addEventListener("pointerdown", giveKeysToGame, true);
      document.addEventListener("fullscreenchange", giveKeysToGame);
      window.addEventListener("resize", giveKeysToGame);

      function showBanner(msg, type) {
        if (type === "error") {
          var el = document.getElementById("error");
          el.textContent = msg;
          el.style.display = "block";
        } else {
          console.warn(msg);
        }
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: showBanner,
        // Full-screen 4K would render 8 million pixels a frame: cap the resolution so the beat stays smooth.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
      };

      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.getElementById("fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.getElementById("loading").style.display = "none";
          giveKeysToGame();
        }).catch(function (message) {
          showBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
